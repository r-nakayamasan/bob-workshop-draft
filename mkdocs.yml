  - ハンズオン (v1・旧バージョン):
      - Lab 1 - 要件定義書からの実装 (v1・旧バージョン): 03_lab1.md
      - Lab 2 - 既存コードの読み込みと機能追加 (v1・旧バージョン): 04_lab2.md
      - Lab 3 - コードレビュー (v1・旧バージョン): 05_lab3.md

# Theme
theme:
  name: material
  language: 'ja'
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  icon:
    logo: material/library
  logo: assets/images/bob_image.png
  features:
    - navigation.tabs
    - content.code.copy
    - content.code.select
    #- navigation.instant
  palette:
    scheme: default
    primary: blue
    accent: blue

# Markdown Extensions
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
          - name: mermaid
            class: mermaid
            format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - pymdownx.details

# Extra CSS
extra_css:
  - stylesheets/extra.css

